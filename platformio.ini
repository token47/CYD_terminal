[platformio]
src_dir = .
include_dir = .
default_envs = esp32-2432s028r

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=1
    -D USE_HSPI_PORT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=80000000
    -D SPI_READ_FREQUENCY=20000000

# Environment for 2.8" CYD (ESP32-2432S028R / CYD2USB)
# Backlight on GPIO 21, RGB color order, non-inverted display, dedicated software SPI touch driver
[env:esp32-2432s028r]
build_flags =
    ${env.build_flags}
    -D TFT_BL=21
    -D TFT_RGB_ORDER=0
    -D TFT_INVERSION_OFF=1
    -D USE_CUSTOM_TOUCH=1

# Environment for 3.2" CYD (FNK0103L_3P2)
# Backlight on GPIO 27, BGR color order, inverted display, shared SPI touch
[env:esp32-cyd-32]
build_flags =
    ${env.build_flags}
    -D TFT_BL=27
    -D TFT_RGB_ORDER=1
    -D TFT_INVERSION_ON=1
    -D TOUCH_CS=33
    -D SPI_TOUCH_FREQUENCY=2500000
